<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>403 Access Denied — Kaushal Malvi</title>
  <meta name="robots" content="noindex" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --color-charcoal: #1E1E1E;
      --color-red: #E02A1F;
      --color-red-dusty: #B85C5C;
      --font-display: 'Anton', sans-serif;
      --font-sans: 'Montserrat', sans-serif;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background-color: var(--color-charcoal);
      color: #fff;
      font-family: var(--font-sans);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    /* Film Grain */
    .grain-overlay {
      position: absolute;
      inset: -150%;
      width: 400%;
      height: 400%;
      background-image: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
      opacity: 0.11;
      pointer-events: none;
      animation: grain 8s steps(10) infinite;
      z-index: 1;
    }

    @keyframes grain {
      0%, 100% { transform: translate(0, 0); }
      10% { transform: translate(-5%, -10%); }
      20% { transform: translate(-15%, 5%); }
      30% { transform: translate(7%, -25%); }
      40% { transform: translate(-5%, 25%); }
      50% { transform: translate(-15%, 10%); }
      60% { transform: translate(15%, 0%); }
      70% { transform: translate(0%, 15%); }
      80% { transform: translate(3%, 35%); }
      90% { transform: translate(-10%, 10%); }
    }

    /* Corner Labels */
    .corners {
      position: absolute;
      top: 2rem;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      padding: 0 2rem;
      z-index: 10;
    }
    @media (min-width: 768px) {
      .corners { padding: 0 3.5rem; }
    }
    .corner-label {
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #BFBFBF;
    }

    /* Content */
    .content {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 0 1.5rem;
    }
    
    .anim-wrap {
      overflow: hidden;
      margin-bottom: 1.5rem;
    }

    .error-code {
      font-family: var(--font-display);
      font-size: clamp(6rem, 20vw, 15rem);
      line-height: 0.85;
      letter-spacing: 0.02em;
      background: linear-gradient(to bottom, #FFFFFF 0%, #E02A1F 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      display: block;
      margin-bottom: 1rem;
    }

    .error-title {
      font-size: clamp(1.2rem, 4vw, 2rem);
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--color-red-dusty);
    }

    .error-msg {
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.65);
      margin-bottom: 3rem;
      max-width: 400px;
      margin-inline: auto;
      line-height: 1.6;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #fff;
      text-decoration: none;
      background: var(--color-red);
      padding: 14px 28px;
      border-radius: 100px;
      transition: opacity 0.2s, transform 0.2s;
    }
    .btn:hover {
      opacity: 0.85;
      transform: scale(0.97);
    }
    
    /* Hide initial state for GSAP */
    .reveal { opacity: 0; transform: translateY(60px); }
  </style>
</head>
<body>

  <div class="grain-overlay"></div>

  <div class="corners">
    <span class="corner-label">Portfolio 2026</span>
    <span class="corner-label">Error 403</span>
  </div>

  <div class="content">
    <div class="anim-wrap">
      <span class="error-code reveal">403</span>
    </div>
    <div class="anim-wrap" style="margin-bottom: 0;">
      <h1 class="error-title reveal">Access Denied</h1>
    </div>
    <div class="anim-wrap" style="margin-bottom: 0;">
      <p class="error-msg reveal">You don't have permission to view this page.</p>
    </div>
    <div class="anim-wrap">
      <a href="/" class="btn reveal">
        <span style="font-weight: 700;">//</span> Back to Home
      </a>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const elements = document.querySelectorAll('.reveal');
      
      if (prefersReduced) {
        gsap.set(elements, { opacity: 1, y: 0 });
        return;
      }
      
      gsap.to(elements, {
        y: 0,
        opacity: 1,
        duration: 0.9,
        ease: 'power3.out',
        stagger: 0.12,
        delay: 0.1
      });
    });
  </script>
</body>
</html>
